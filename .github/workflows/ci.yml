name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      # The container build is the deployment artifact, so a build failure
      # is a release failure and belongs on every push rather than being
      # discovered at deploy time.
      - name: Build the container
        run: docker build -t repo-pilot:ci .

      - name: Python tests
        # The suite is hermetic: no network, no API keys, fakes throughout.
        run: python -m unittest discover -s tests -t .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test
