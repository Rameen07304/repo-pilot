<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repo Pilot — Codebase Onboarding Agent</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧭 Repo Pilot</h1>
            <p class="subtitle">Point it at any public GitHub repo. Explore, ask questions, see the architecture.</p>
        </header>

        <section class="ingest-section">
            <form id="ingest-form">
                <input
                    type="text"
                    id="repo-url"
                    placeholder="https://github.com/owner/repo"
                    required
                />
                <button type="submit" id="ingest-btn">Ingest Repo</button>
            </form>
            <div id="ingest-status"></div>
        </section>

        <section id="repo-info" class="hidden">
            <h2>Repository Summary</h2>
            <p id="repo-summary"></p>
            <div class="meta-row">
                <span id="repo-files"></span>
                <span id="repo-stack"></span>
            </div>
        </section>

        <section id="tabs" class="hidden">
            <div class="tab-buttons">
                <button class="tab-btn active" data-tab="ask-tab">Ask a Question</button>
                <button class="tab-btn" data-tab="diagram-tab">Architecture Diagram</button>
            </div>

            <div id="ask-tab" class="tab-content active">
                <form id="ask-form">
                    <input
                        type="text"
                        id="question-input"
                        placeholder="How does authentication work?"
                        required
                    />
                    <label class="deep-mode-toggle">
                        <input type="checkbox" id="deep-mode-checkbox" />
                        Deep investigation mode
                    </label>
                    <button type="submit" id="ask-btn">Ask</button>
                </form>
                <div id="ask-status"></div>
                <div id="answer-box" class="hidden">
                    <h3>Answer</h3>
                    <p id="answer-text"></p>
                    <div id="answer-meta"></div>
                    <h4>Citations</h4>
                    <ul id="citations-list"></ul>
                </div>
            </div>

            <div id="diagram-tab" class="tab-content">
                <button id="diagram-btn">Generate Diagram</button>
                <div id="diagram-status"></div>
                <div id="mermaid-container" class="hidden">
                    <pre class="mermaid" id="mermaid-diagram"></pre>
                </div>
            </div>
        </section>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
